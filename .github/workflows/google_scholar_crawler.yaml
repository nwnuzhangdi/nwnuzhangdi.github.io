name: Get Citation Data

on:
  page_build:
  workflow_dispatch:   # 可在 Actions 页面手动点 “Run workflow” 触发
  schedule:
    - cron: '0 8 * * *'   # 每天 08:00 UTC = 北京时间 16:00

# 新建仓库的 GITHUB_TOKEN 默认只读，必须显式给写权限，否则最后 push 分支会 403
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10   # 兜底：卡住时最多占 10 分钟，不会一直挂着
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Reqs
        working-directory: ./google_scholar_crawler
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run crawler
        working-directory: ./google_scholar_crawler
        env:
          GOOGLE_SCHOLAR_ID: ${{ secrets.GOOGLE_SCHOLAR_ID }}
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
        run: |
          if [ -z "$GOOGLE_SCHOLAR_ID" ]; then
            echo "::error::缺少 secret GOOGLE_SCHOLAR_ID，请到 Settings → Secrets and variables → Actions 添加"
            exit 1
          fi
          python main.py
          ls -l results

      - name: Publish to google-scholar-stats branch
        if: success()
        run: |
          cd ./google_scholar_crawler/results
          git init -b google-scholar-stats
          git config --local user.name "${GITHUB_ACTOR}"
          git config --local user.email "${GITHUB_ACTOR}@users.noreply.github.com"
          git add *.json
          git commit -m "Updated Citation Data"
          git push --force "https://${GITHUB_ACTOR}:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" HEAD:google-scholar-stats
